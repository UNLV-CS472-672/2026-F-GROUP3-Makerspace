name: ✨ Feature Request
description: Suggest new functionality or an improvement to the Makerspace app.
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What problem does this solve, and for whom (student, admin, staff)?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: What should the app do? Include rough UI or data changes if you have them.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Other approaches you thought about and why they are worse.
  - type: textarea
    attributes:
      label: Additional Context
      description: Mockups, links, or related issues.
